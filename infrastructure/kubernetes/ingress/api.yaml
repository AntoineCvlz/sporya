# Monolithe modulaire (ADR-017) : un seul déployable derrière /api/v1, tous
# les modules (auth, puis club, match, ...) partagent ce même Ingress — plus
# besoin d'un Ingress par module à chaque nouveau module ajouté.
#
# /actuator/* n'est volontairement PAS exposé ici (accès interne seulement,
# pour les probes K8s et le scrape Prometheus) — voir docs/deployment/README.md.
#
# letsencrypt-prod — validé d'abord en letsencrypt-staging (voir ADR-015),
# émission HTTP-01 confirmée sur ce host le 12/08/2026.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: sporya
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - sporya.antoine-cuvilliez.fr
      secretName: sporya-tls-prod
  rules:
    - host: sporya.antoine-cuvilliez.fr
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
