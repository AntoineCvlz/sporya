# Ingress par service, fusionnés par Traefik sur le même host — chaque
# service route sur son propre préfixe d'API versionné (/api/v1/auth,
# /api/v1/clubs, ...), donc pas besoin de Middleware de réécriture : le
# chemin transmis au pod est déjà celui que le contrôleur attend.
#
# /actuator/* n'est volontairement PAS exposé ici (accès interne seulement,
# pour les probes K8s et le scrape Prometheus) — voir docs/deployment/README.md.
#
# letsencrypt-prod — validé d'abord en letsencrypt-staging (voir ADR-015),
# émission HTTP-01 confirmée sur ce host le 12/08/2026.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth-service
  namespace: sporya
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - sporya.antoine-cuvilliez.fr
      secretName: sporya-tls-prod
  rules:
    - host: sporya.antoine-cuvilliez.fr
      http:
        paths:
          - path: /api/v1/auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 8080
