# Ingress par service, fusionnés par Traefik sur le même host (routage par
# chemin — voir infrastructure/kubernetes/README.md). Un fichier par service
# ajouté au fur et à mesure, pas un unique Ingress monolithique.
#
# letsencrypt-prod — validé d'abord en letsencrypt-staging (voir ADR-015),
# émission HTTP-01 confirmée sur ce host le 12/08/2026.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth-service
  namespace: sporya
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Retire /api/auth avant transmission au pod — voir middleware-strip-auth-prefix.yaml
    traefik.ingress.kubernetes.io/router.middlewares: sporya-strip-auth-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - sporya.antoine-cuvilliez.fr
      secretName: sporya-tls-prod
  rules:
    - host: sporya.antoine-cuvilliez.fr
      http:
        paths:
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 8080
