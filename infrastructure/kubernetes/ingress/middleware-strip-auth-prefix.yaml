# Retire le préfixe /api/auth avant de transmettre au pod — l'app Spring
# Boot ne connaît que ses chemins natifs (/actuator/health, etc.), pas son
# point de montage externe. Un Middleware par service à mesure qu'ils
# arrivent (strip-club-prefix, strip-match-prefix, ...).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-auth-prefix
  namespace: sporya
spec:
  stripPrefix:
    prefixes:
      - /api/auth
