# Gabarit — NE JAMAIS committer les vraies valeurs (voir section Sécurité du
# cadrage : "ne jamais mettre de secrets dans Git").
#
# Créer le vrai Secret directement sur le VPS, en impératif (pas via ce
# fichier) :
#
#   kubectl create secret generic postgres-credentials \
#     --namespace sporya \
#     --from-literal=POSTGRES_USER=sporya \
#     --from-literal=POSTGRES_PASSWORD='<mot-de-passe-généré>' \
#     --from-literal=POSTGRES_DB=sporya
#
# Un seul Secret partagé par les services applicatifs pour l'instant (compte
# admin unique sur l'instance Postgres mutualisée, voir ADR-012) — un rôle
# Postgres dédié par service avec privilèges limités à son schéma est une
# amélioration future documentée mais non bloquante pour le MVP.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: sporya
type: Opaque
stringData:
  POSTGRES_USER: CHANGE_ME
  POSTGRES_PASSWORD: CHANGE_ME
  POSTGRES_DB: sporya
