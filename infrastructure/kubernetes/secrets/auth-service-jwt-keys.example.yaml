# Gabarit — NE JAMAIS committer les vraies valeurs.
#
# Générer une paire RSA dédiée à la prod (jamais celle de dev de .env.example)
# et créer le Secret directement sur le VPS, en impératif :
#
#   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out private.pem
#   openssl rsa -pubout -in private.pem -out public.pem
#
#   kubectl create secret generic auth-service-jwt-keys \
#     --namespace sporya \
#     --from-literal=JWT_PRIVATE_KEY_BASE64="$(base64 -w0 private.pem)" \
#     --from-literal=JWT_PUBLIC_KEY_BASE64="$(base64 -w0 public.pem)"
#
#   rm private.pem public.pem   # ne pas laisser traîner sur le disque du VPS
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-jwt-keys
  namespace: sporya
type: Opaque
stringData:
  JWT_PRIVATE_KEY_BASE64: CHANGE_ME
  JWT_PUBLIC_KEY_BASE64: CHANGE_ME
