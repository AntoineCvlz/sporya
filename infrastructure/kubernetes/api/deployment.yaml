# API — monolithe modulaire (voir ADR-017), un seul déployable pour tous les
# modules métier (auth, puis club, match, ...).
# L'image est buildée/publiée par service-ci.yml sur ghcr.io (ADR-016),
# taguée avec le SHA du commit qui a déclenché le run CI — mettre à jour le
# tag ci-dessous à chaque nouveau déploiement manuel (voir docs/deployment/README.md).
# Renommé de auth-service à api le 2026-08-14 (ADR-017) : nécessite un nouveau
# build CI publiant ghcr.io/antoinecvlz/api avant un premier déploiement sous ce nom.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: sporya
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      containers:
        - name: api
          image: ghcr.io/antoinecvlz/api:fe7b1bc76de69cb88e5e536a9860d4a2b3cb4347
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: JWT_PRIVATE_KEY_BASE64
              valueFrom:
                secretKeyRef:
                  name: auth-service-jwt-keys
                  key: JWT_PRIVATE_KEY_BASE64
            - name: JWT_PUBLIC_KEY_BASE64
              valueFrom:
                secretKeyRef:
                  name: auth-service-jwt-keys
                  key: JWT_PUBLIC_KEY_BASE64
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            # Généreux exprès : un démarrage lent (VPS sous pression CPU) ne doit
            # pas déclencher un kill-restart en boucle qui aggrave la situation
            # (vécu le 12/08/2026 — 25 min avant stabilisation).
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            # Plafond JVM explicite (Dockerfile) ~368Mi (heap+metaspace+direct+code
            # cache) — marge au-dessus pour l'overhead natif du process et les
            # threads. Voir docs/deployment/README.md#dimensionnement-mémoire.
            requests:
              cpu: 100m
              memory: 300Mi
            limits:
              cpu: 500m
              memory: 400Mi
