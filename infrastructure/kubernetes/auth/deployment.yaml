# Auth Service — gabarit pour les déploiements suivants (voir ADR-004).
# L'image est buildée/publiée par service-ci.yml sur ghcr.io (ADR-016),
# taguée avec le SHA du commit qui a déclenché le run CI — mettre à jour le
# tag ci-dessous à chaque nouveau déploiement manuel (voir docs/deployment/README.md).
# Dernier déploiement : commit 517ae344ce5b26494332941317e26a5bce7e3bf0
# (vraie logique métier register/login/me).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: sporya
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-service
    spec:
      containers:
        - name: auth-service
          image: ghcr.io/antoinecvlz/auth-service:517ae344ce5b26494332941317e26a5bce7e3bf0
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: JWT_PRIVATE_KEY_BASE64
              valueFrom:
                secretKeyRef:
                  name: auth-service-jwt-keys
                  key: JWT_PRIVATE_KEY_BASE64
            - name: JWT_PUBLIC_KEY_BASE64
              valueFrom:
                secretKeyRef:
                  name: auth-service-jwt-keys
                  key: JWT_PUBLIC_KEY_BASE64
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 512Mi
