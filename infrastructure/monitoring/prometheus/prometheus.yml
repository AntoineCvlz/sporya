global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Monolithe applicatif (ADR-017) — expose /actuator/prometheus (voir ADR-009).
  - job_name: api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8080"]
