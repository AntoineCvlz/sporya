server:
  port: 8080

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sporya}
    username: ${DB_USER:sporya}
    password: ${DB_PASSWORD:sporya}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: auth
  flyway:
    schemas: auth
    default-schema: auth
    create-schemas: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

sporya:
  jwt:
    # PEM (PKCS8/X.509) encodé en base64 — voir services/auth-service/README.md
    # pour la génération. Jamais de vraie clé de prod dans ce fichier ou .env.example.
    private-key-base64: ${JWT_PRIVATE_KEY_BASE64}
    public-key-base64: ${JWT_PUBLIC_KEY_BASE64}
    issuer: sporya-auth-service
    access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:15}
