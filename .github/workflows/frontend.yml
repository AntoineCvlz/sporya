name: Frontend CI
# Un seul workflow direct (pas de gabarit réutilisable comme service-ci.yml) :
# le frontend est pour l'instant le seul projet Node du repo — voir ADR-004
# pour la logique de gabarit côté services Java.

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**"]
  workflow_dispatch: {}

jobs:
  build-and-test:
    name: Build & test (frontend)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Resolve image name
        id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$owner/frontend:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: docker build -t ${{ steps.meta.outputs.image }} .

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push ${{ steps.meta.outputs.image }}

  deploy:
    name: Deploy to VPS
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # deploy.sh (sur le VPS) ne déploie que le service frontend — jamais
      # api au même SHA, voir ADR-019 : api.yml et frontend.yml se
      # déclenchent indépendamment selon le chemin modifié.
      #
      # SSH natif + known_hosts plutôt qu'une action tierce (appleboy/
      # ssh-action) : sa vérification par "fingerprint" a échoué de façon
      # non diagnosticable (host key fingerprint mismatch, empreinte
      # pourtant confirmée correcte par deux méthodes indépendantes) — voir
      # ADR-019.
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy frontend
        run: ssh -o StrictHostKeyChecking=yes deploy@${{ secrets.VPS_HOST }} "frontend ${{ github.sha }}"
