name: Auth Service CI
on:
  push:
    branches: [main]
    paths: ["services/auth-service/**"]
  pull_request:
    paths: ["services/auth-service/**"]
jobs:
  ci:
    uses: ./.github/workflows/service-ci.yml
    permissions:
      contents: read
      packages: write
    with:
      service_path: services/auth-service
