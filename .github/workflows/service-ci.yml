name: Service CI

# Reusable workflow — voir ADR-004. Aucun service ne l'invoque encore ;
# il sera appelé par un workflow court (ex. .github/workflows/auth-service.yml)
# au moment où le premier service (Auth) sera construit — voir README de ce dossier.

on:
  workflow_call:
    inputs:
      service_path:
        description: "Chemin du service, ex. services/auth-service"
        required: true
        type: string
      java_version:
        required: false
        type: string
        default: "21"

jobs:
  build-and-test:
    name: Build & test (${{ inputs.service_path }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: ${{ inputs.service_path }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: maven

      - name: Lint
        run: ./mvnw -B spotless:check

      - name: Unit & integration tests
        run: ./mvnw -B verify

      - name: Dependency vulnerability check
        run: ./mvnw -B org.owasp:dependency-check-maven:check
        continue-on-error: true # non bloquant tant qu'aucune baseline de faux positifs n'est établie

      - name: Package
        run: ./mvnw -B package -DskipTests

      - name: Resolve image name
        id: meta
        run: |
          name=$(basename ${{ inputs.service_path }})
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]') # ghcr.io exige un nom en minuscules
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$owner/$name:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        # cwd = inputs.service_path (via defaults.run.working-directory) -> le contexte est "."
        run: docker build -t ${{ steps.meta.outputs.image }} .

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Log in to GHCR
        # Uniquement au push sur main — voir ADR-016. Les PR construisent et
        # scannent l'image sans la publier.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push ${{ steps.meta.outputs.image }}
