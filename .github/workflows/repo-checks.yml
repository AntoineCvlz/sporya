name: Repository Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: docker://zricethezav/gitleaks:v8.21.2
        with:
          args: detect --source /github/workspace -v --redact

  lint-workflows:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  validate-compose:
    name: Validate docker-compose.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: docker compose config (local)
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: docker compose config (prod, ADR-018)
        working-directory: infrastructure/docker
        run: |
          # Valeurs factices : cette étape valide seulement la syntaxe/l'interpolation,
          # jamais utilisée pour un vrai déploiement (voir .env.prod.example).
          cat > .env <<'EOF'
          ACME_EMAIL=ci@example.com
          IMAGE_TAG=ci-test
          POSTGRES_PASSWORD=ci-test
          GRAFANA_ADMIN_PASSWORD=ci-test
          JWT_PRIVATE_KEY_BASE64=ci-test
          JWT_PUBLIC_KEY_BASE64=ci-test
          EOF
          docker compose -f docker-compose.prod.yml config --quiet
