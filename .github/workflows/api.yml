name: API CI
on:
  push:
    branches: [main]
    paths:
      - "backend/api/**"
      - ".github/workflows/api.yml"
      - ".github/workflows/service-ci.yml"
  pull_request:
    paths: ["backend/api/**"]
  workflow_dispatch: {} # permet un re-run manuel indépendant des filtres de chemin ci-dessus
jobs:
  ci:
    uses: ./.github/workflows/service-ci.yml
    permissions:
      contents: read
      packages: write
    with:
      service_path: backend/api

  deploy:
    name: Deploy to VPS
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # deploy.sh (sur le VPS) ne déploie que le service api — jamais frontend
      # au même SHA, voir ADR-019 : api.yml et frontend.yml se déclenchent
      # indépendamment selon le chemin modifié.
      #
      # SSH natif + known_hosts plutôt qu'une action tierce (appleboy/
      # ssh-action) : sa vérification par "fingerprint" a échoué de façon
      # non diagnosticable (host key fingerprint mismatch, empreinte
      # pourtant confirmée correcte par deux méthodes indépendantes) — voir
      # ADR-019.
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy api
        run: ssh -o StrictHostKeyChecking=yes deploy@${{ secrets.VPS_HOST }} "api ${{ github.sha }}"
