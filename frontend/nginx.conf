# SPA : toute route inconnue retombe sur index.html (React Router gère le
# routage côté client).
#
# /api/v1/auth/ est relayé vers auth-service:8080 — utile uniquement pour
# `docker compose up` en local (réseau Docker unique, pas d'ingress). En
# production K3s, ce bloc ne sert jamais : l'Ingress route /api/v1/auth
# directement vers auth-service sans passer par ce pod (voir
# infrastructure/kubernetes/ingress/). Un bloc par service backend, ajouté
# au fur et à mesure.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/v1/auth/ {
        proxy_pass http://auth-service:8080/api/v1/auth/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
