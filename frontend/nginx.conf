# SPA : toute route inconnue retombe sur index.html (React Router gère le
# routage côté client).
#
# /api/v1/ est relayé vers api:8080 (monolithe modulaire, ADR-017) — utile
# uniquement pour `docker compose up` en local (réseau Docker unique, pas
# d'ingress). En production K3s, ce bloc ne sert jamais : l'Ingress route
# /api/v1 directement vers le service api sans passer par ce pod (voir
# infrastructure/kubernetes/ingress/).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/v1/ {
        proxy_pass http://api:8080/api/v1/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
